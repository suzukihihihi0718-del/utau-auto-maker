<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0">

<title>UTAU自動作曲</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <h1>🎤 UTAU自動作曲</h1>

  <p class="description">
    歌詞を入力するだけで、メロディとUSTを自動生成します。
  </p>

  <section class="card">

    <h2>① 歌詞</h2>

    <textarea
      id="lyrics"
      placeholder="例：君と見た空を忘れない"></textarea>

  </section>


  <section class="card">

    <h2>② UTAU音源</h2>

    <input
      type="file"
      id="voicebank"
      accept=".zip">

    <p id="voiceStatus">
      UTAU音源ZIPを選択してください
    </p>

  </section>


  <section class="card">

    <button id="makeButton">
      🎵 作曲する！
    </button>

    <div id="status"></div>

  </section>


  <section
    class="card"
    id="result"
    style="display:none">

    <h2>🎉 完成！</h2>

    <div id="info"></div>

    <a
      id="ustDownload"
      class="download"
      download="song.ust">
      📝 USTを保存
    </a>

    <a
      id="wavDownload"
      class="download"
      style="display:none"
      download="song.wav">
      🔊 WAVを保存
    </a>

    <audio
      id="player"
      controls
      style="width:100%">
    </audio>

  </section>

</div>

<script src="app.js"></script>

</body>
</html>
